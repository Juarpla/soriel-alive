name: Keep Soriel API alive

on:
  schedule:
    # Once a day at 12:00 UTC. GitHub cron can lag, but this stays
    # well inside Hugging Face's 48-hour inactivity window.
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Hugging Face Space
        env:
          SPACE_URL: ${{ vars.SPACE_URL || 'https://juarpla-soriel-api.hf.space/api-status' }}
        run: |
          set -euo pipefail
          echo "Pinging: $SPACE_URL"

          attempts=6
          for i in $(seq 1 "$attempts"); do
            code=$(curl -sS -L -o /tmp/body.txt -w '%{http_code}' \
              --connect-timeout 20 --max-time 120 \
              "$SPACE_URL" || echo "000")
            echo "Attempt $i/$attempts -> HTTP $code"

            if [ "$code" = "200" ]; then
              echo "Space is awake:"
              cat /tmp/body.txt
              exit 0
            fi

            sleep $((i * 15))
          done

          echo "::warning::Space did not return HTTP 200 after $attempts attempts."
          exit 0
